name: Verify starter
on:
  push:
    branches: [develop, main, 'setup/**']
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  clean-start:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Start from an empty database
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Verify browser entry point and role isolation
        run: node scripts/check-starter.mjs
      - name: Restart and reapply setup without duplicating data
        run: |
          docker compose restart db
          docker compose up -d --wait
          docker compose run --rm --no-deps init
          node scripts/check-starter.mjs
      - name: Verify release build and self-host configuration
        env:
          APP_DOMAIN: ci.harmony.invalid
          DB_PASSWORD: ci_only_configuration_check
        run: |
          docker compose -f compose.production.yaml config -q
          docker compose -f compose.production.yaml build migrate web
      - name: Show services on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Remove disposable CI stack
        if: always()
        run: docker compose down -v
